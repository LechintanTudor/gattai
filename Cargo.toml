[package]
name = "gattai"
version = "26.3.0"
edition = "2024"
description = "Combine multiple images into a single sprite sheet"
authors = ["Tudor-Cristian Lechințan <lechintantudor02@gmail.com>"]
repository = "https://github.com/LechintanTudor/gattai"
keywords = ["cli", "gamedev", "packer", "sprite", "spritesheet"]
categories = ["command-line-utilities", "game-development", "multimedia::images"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
heck = "0.5"
image = "0.25"
rayon = "1.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module-name-repetitions = "allow"
wildcard-imports = "allow"
